name: Deploy to GitHub Pages




on:
  push:
    branches:
      - main

  workflow_dispatch:



permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ativar Corepack (Yarn)
        run: corepack enable

      - name: Instalar dependências com Yarn
        run: yarn install

      - name: Build
        run: yarn build

      - name: Deploy para gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
